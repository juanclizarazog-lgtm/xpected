# Xpected · plano de Render (https://render.com): «New → Blueprint» y elegir este repositorio.
# Guía paso a paso: docs/despliegue.md
services:
  - type: web
    name: xpected
    runtime: node
    # Plan gratuito para probar: se apaga tras 15 minutos sin visitas (tarda ~1 minuto en despertar), no congela
    # pronósticos mientras duerme y, sin disco, vuelve a los datos iniciales de lib/seed/ en cada reinicio.
    # Para dejarlo siempre encendido y guardar el historial: plan «starter» y el bloque «disk» (ver docs/despliegue.md).
    plan: free
    region: virginia
    buildCommand: node --version
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Contraseña de acceso. Render la pide al crear el servicio; mientras los datos sean solo de desarrollo
      # (ESPN), déjala puesta para que el sitio no sea público.
      - key: XPECTED_PASSWORD
        sync: false
    # (El plan gratuito no admite disco. Con «starter», agrega aquí:
    #   disk: { name: xpected-data, mountPath: /opt/render/project/src/data, sizeGB: 1 })
